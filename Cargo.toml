[package]
name = "pm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
futures = "0.3.34"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "brotli", "http2", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
